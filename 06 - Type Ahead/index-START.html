<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Type Ahead 👀</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>

  <form class="search-form">
    <input type="text" class="search" placeholder="City or State">
    <ul class="suggestions">
      <li>Filter for a city</li>
      <li>or a state</li>
    </ul>
  </form>
<script>
const endpoint = 'https://gist.githubusercontent.com/Miserlou/c5cd8364bf9b2420bb29/raw/2bf258763cdddd704f8ffd3ea9a3e81d25e2c6f6/cities.json';
const cities = []; //declare empty array to hold data fetched from endpoint

fetch(endpoint) 
  .then(Blob => Blob.json()) // fetch data from endpoint and convert to json
  .then(data => cities.push(...data)) //fetch data and convert to json, we push the data into the cities since cities variable is a constant and we can't reassign it, but we can push data into it. We use the spread operator to push each item in the data array into the cities array.
  // '...' is the spread operator, it takes each item in the data array and pushes it into the cities array. If we didn't use the spread operator, we would be pushing the entire data array into the cities array as a single item, which is not what we want.
function findMatches(wordToMatch, cities) {
  return cities.filter(place => {
    // here we need to figure out if the city or state matches what was searched
    const regex = new RegExp(wordToMatch, 'gi'); // 'g' for global search, 'i' for case insensitive
    return place.city.match(regex) || place.state.match(regex); // if the city or state matches the regex, we return true and the item will be included in the filtered array
  });
}
function numberWithCommas(x) {
  return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); // this function takes a number and adds commas to it for thousands, millions, etc. It uses a regular expression to find the positions where commas should be added and replaces them with a comma.
}

function displayMatches() {
  const matchArray = findMatches(this.value, cities);
  const html = matchArray.map(place => {
    const regex = new RegExp(this.value, 'gi');
    const cityName = place.city.replace(regex, `<span class="hl">${this.value}</span>`);
    const stateName = place.state.replace(regex, `<span class="hl">${this.value}</span>`);
    return `
      <li>
        <span class="name">${cityName}, ${stateName}</span>
        <span class="population">${numberWithCommas(place.population)}</span>
      </li>
    `;
  }).join('');
  suggestions.innerHTML = html;
}
searchInput.addEventListener('change', displayMatches);
searchInput.addEventListener('keyup', displayMatches); // we want to listen for both 'change' and 'keyup' events on the search input, so that we can display matches as the user types and also when they change the input (e.g. by pasting text)
</script>
</body>
</html>
