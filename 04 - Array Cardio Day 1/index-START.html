<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // Get your shorts on - this is an array workout!
    // ## Array Cardio Day 1

    // Some data we can work with

    const inventors = [
      { first: 'Albert', last: 'Einstein', year: 1879, passed: 1955 },
      { first: 'Isaac', last: 'Newton', year: 1643, passed: 1727 },
      { first: 'Galileo', last: 'Galilei', year: 1564, passed: 1642 },
      { first: 'Marie', last: 'Curie', year: 1867, passed: 1934 },
      { first: 'Johannes', last: 'Kepler', year: 1571, passed: 1630 },
      { first: 'Nicolaus', last: 'Copernicus', year: 1473, passed: 1543 },
      { first: 'Max', last: 'Planck', year: 1858, passed: 1947 },
      { first: 'Katherine', last: 'Blodgett', year: 1898, passed: 1979 },
      { first: 'Ada', last: 'Lovelace', year: 1815, passed: 1852 },
      { first: 'Sarah E.', last: 'Goode', year: 1855, passed: 1905 },
      { first: 'Lise', last: 'Meitner', year: 1878, passed: 1968 },
      { first: 'Hanna', last: 'Hammarström', year: 1829, passed: 1909 }
    ];

    const people = [
      'Bernhard, Sandra', 'Bethea, Erin', 'Becker, Carl', 'Bentsen, Lloyd', 'Beckett, Samuel', 'Blake, William', 'Berger, Ric', 'Beddoes, Mick', 'Beethoven, Ludwig',
      'Belloc, Hilaire', 'Begin, Menachem', 'Bellow, Saul', 'Benchley, Robert', 'Blair, Robert', 'Benenson, Peter', 'Benjamin, Walter', 'Berlin, Irving',
      'Benn, Tony', 'Benson, Leana', 'Bent, Silas', 'Berle, Milton', 'Berry, Halle', 'Biko, Steve', 'Beck, Glenn', 'Bergman, Ingmar', 'Black, Elk', 'Berio, Luciano',
      'Berne, Eric', 'Berra, Yogi', 'Berry, Wendell', 'Bevan, Aneurin', 'Ben-Gurion, David', 'Bevel, Ken', 'Biden, Joseph', 'Bennington, Chester', 'Bierce, Ambrose',
      'Billings, Josh', 'Birrell, Augustine', 'Blair, Tony', 'Beecher, Henry', 'Biondo, Frank'
    ];
    
    // Array.prototype.filter()
    // 1. Filter the list of inventors for those who were born in the 1500's
    const fifteen = inventors.filter(inventor => (inventor.year >= 1500 && inventor.year < 1600)); //Syntax: array.prototype = inventors, remember that.
    console.log(fifteen); //logs the filtered array of inventors who were born in the 1500s to the console.
    // Array.prototype.map()
    // 2. Give us an array of the inventors first and last names
    const fullNames = inventors.map(inventor => `${inventor.first} ${inventor.last}`);
    console.table(fullNames); //logs the array of full names of the inventors to the console.
    // Array.prototype.sort()
    // 3. Sort the inventors by birthdate, oldest to youngest
    const ordered = inventors.sort((a, b) => a.year > b.year ? 1 : -1);
    console.table(ordered); //logs the sorted array of inventors to the console.
    // Array.prototype.reduce()
    // 4. How many years did all the inventors live all together?
    const totalYears = inventors.reduce((total, inventor) => {
      return total + (inventor.passed - inventor.year);
    }, 0); //The reduce method takes a callback function and an initial value. The callback function takes two arguments: the accumulator (total) and the current value (inventor). The callback function returns the updated accumulator value, which is the total number of years lived by all inventors. The initial value is set to 0.
    console.log(totalYears); //logs the total number of years lived by all inventors to the console.
    // 5. Sort the inventors by years lived
    const yearsLived = inventors.sort((a, b) => (b.passed - b.year) - (a.passed - a.year));
    console.table(yearsLived);

    // 6. create a list of Boulevards in Paris that contain 'de' anywhere in the name
    // https://en.wikipedia.org/wiki/Category:Boulevards_in_Paris
    const category = document.querySelector('.mw-category'); //selects the element with the class of mw-category and stores it in a variable called category.
    const links = Array.from(category.querySelectorAll('a')); //selects all the anchor elements inside the category element and converts the NodeList to an array using Array.from() and stores it in a variable called links.
    const de = links.map(link => link.textContent).filter(streetName => streetName.includes('de')); //maps over the links array and returns the text content of each link, then filters the array to include only the street names that include 'de' and stores it in a variable called de.
    console.log(de); //logs the array of street names that include 'de' to the console.


    // 7. sort Exercise
    // Sort the people alphabetically by last name
    const alpha = people.sort((lastOne, nextOne) => {
      const [aLast, aFirst] = lastOne.split(', '); //splits the lastOne string into an array of two elements: the last name and the first name. The destructuring assignment syntax is used to assign the last name to aLast and the first name to aFirst.
      const [bLast, bFirst] = nextOne.split(', '); //splits the nextOne string into an array of two elements: the last name and the first name. The destructuring assignment syntax is used to assign the last name to bLast and the first name to bFirst.
      return aLast > bLast ? 1 : -1; //compares the last names of a and b and returns 1 if a's last name is greater than b's last name, otherwise it returns -1. This sorts the people alphabetically by last name.
    });
    console.log(alpha); //logs the sorted array of people to the console.

    // 8. Reduce Exercise
    // Sum up the instances of each of these
    const data = ['car', 'car', 'truck', 'truck', 'bike', 'walk', 'car', 'van', 'bike', 'walk', 'car', 'van', 'car', 'truck' ];
    const transportation = data.reduce(function(obj, item) {
      if(!obj[item]) {
        obj[item] = 0; //if the item is not already a property of the object, it is added as a property with a value of 0.
      }
      obj[item]++; //the value of the property is incremented by 1 for each occurrence of the item in the data array.
      return obj; //the updated object is returned after each iteration of the reduce method.
    }, {}); //The initial value of the accumulator is set to an empty object.
  </script>
</body>
</html>
