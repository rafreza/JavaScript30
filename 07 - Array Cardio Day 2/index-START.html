<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
    // Array.prototype.every() // is everyone 19 or older?
    const isAdult = people.some(person => ((new Date()).getFullYear()) - person.year >= 19);
    console.log({isAdult});
    const allAdults = people.every(person => ((new Date()).getFullYear()) - person.year >= 19);
    console.log({allAdults});

    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423

    /* First shot:

    comments.find(function(comment) {
      if (comment.id === 823423) {
        console.log(comment);
        return true;
      }
    }); 
    */

    const comment = comments.find(comment => comment.id === 823423); // we use the find method to search through the comments array and return the first comment that has an id of 823423. We use an arrow function to check if the comment's id matches the id we are looking for, and if it does, we return that comment.

    // Array.prototype.findIndex()
    // Find the comment with this ID
    // delete the comment with the ID of 823423

    /* First shot:
    const index = comments.findIndex(function(comment) {
      if (comment.id === 823423) {
        return true;
      }
    });
   
    */
    const index = comments.findIndex(comment => comment.id === 823423); // we use the findIndex method to search through the comments array and return the index of the first comment that has an id of 823423. We use an arrow function to check if the comment's id matches the id we are looking for, and if it does, we return true, which tells findIndex to return the index of that comment.
    console.log(index);

    const newComments = [
      ...comments.slice(0, index), // we use the slice method to create a new array that includes all the comments up to the index of the comment we want to delete (not including it)
      ...comments.slice(index + 1) // we use the slice method again to create a new array that includes all the comments after the index of the comment we want to delete (not including it)
    ]; // we use the spread operator to combine these two arrays into a single array, which will be our new comments array without the comment that has the id of 823423.
    console.log(newComments);
  </script>
</body>
</html>
