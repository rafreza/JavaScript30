<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hold Shift to Check Multiple Checkboxes</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <style>

    html {
      font-family: sans-serif;
      background: #ffc600;
    }

    .inbox {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      border-radius: 5px;
      box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
    }

    .item {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #F1F1F1;
    }

    .item:last-child {
      border-bottom: 0;
    }

    input:checked + p {
      background: #F9F9F9;
      text-decoration: line-through;
    }

    input[type="checkbox"] {
      margin: 20px;
    }

    p {
      margin: 0;
      padding: 20px;
      transition: background 0.2s;
      flex: 1;
      font-family:'helvetica neue';
      font-size: 20px;
      font-weight: 200;
      border-left: 1px solid #D1E2FF;
    }
  </style>
   <!--
   The following is a common layout you would see in an email client.

   When a user clicks a checkbox, holds Shift, and then clicks another checkbox a few rows down, all the checkboxes inbetween those two checkboxes should be checked.

  -->
  <div class="inbox">
    <div class="item">
      <input type="checkbox">
      <p>This is an inbox layout.</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Check one item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Hold down your Shift key</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Check a lower item</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Everything in between should also be set to checked</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Try to do it without any libraries</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Just regular JavaScript</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Good Luck!</p>
    </div>
    <div class="item">
      <input type="checkbox">
      <p>Don't forget to tweet your result!</p>
    </div>
  </div>

<script>
// Get all the checkboxes
// Add a click event listener to each checkbox
// On click, check if the shift key is being held
// If it is, find the first checked checkbox and the last checked checkbox
// Loop through the checkboxes in between and set their checked property to true

const checkboxes = document.querySelectorAll('.inbox input[type="checkbox"]');
let lastChecked; // This variable will keep track of the last checked checkbox
function handleCheck(e) {
  // Check if they had the shift key down
  // AND check that they are checking it
  let inBetween = false;
  if (e.shiftKey && this.checked) { // If the shift key is held and the current checkbox is being checked
    checkboxes.forEach(checkbox => { // Loop through each checkbox
      if (checkbox === this || checkbox === lastChecked) {
        inBetween = !inBetween; // Toggle inBetween when we hit either the current checkbox or the last checked checkbox
      }
      if (inBetween) {
        checkbox.checked = true; // If we are in between, check the checkbox
      }
    });
  }
  lastChecked = this; // Set the lastChecked to the current checkbox
}
checkboxes.forEach(checkbox => checkbox.addEventListener('click', handleCheck)); // Loop through each checkbox and add a click event listener that calls the handleCheck function


/* Points to consider:
- 'this' refers to the checkbox that was clicked on
- when handling events, 'this' is the element that the event handler is attached to
- we need to keep track of the last checked checkbox so that we know where to start and end the inBetween logic
- we can use a boolean variable 'inBetween' to determine when we are between the last checked checkbox and the current checkbox
- anytime you want to deal with inputs from a keyboard, you can check the event object for properties like 'shiftKey' to see if the shift key was held down during the event.
- 'e' refers to the event object that is passed to the event handler function, which contains information about the event that occurred, such as which keys were pressed, which element was clicked, etc.
*/
</script>
</body>
</html>
