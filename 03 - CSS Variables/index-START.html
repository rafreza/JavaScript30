<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoped CSS Variables and JS</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <h2>Update CSS Variables with <span class='hl'>JS</span></h2>
  <div class="controls">
    <label for="spacing">Spacing:</label>
    <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px"> <!-- THIS IS HOW YOU ADD A BODY COMMENT...this is the slider. -->
    
    <label for="blur">Blur:</label>
    <input id="blur" type="range" name="blur" min="0" max="25" value="10" data-sizing="px"> <!--data-sizing is a custom attribute it's suffix is 'px' which will be important for the blur and spacing slider -->

    <label for="base">Base Color</label>
    <input id="base" type="color" name="base" value="#ffc600">
  </div>

  <img src="https://images.contentstack.io/v3/assets/blt06f605a34f1194ff/bltc1564bc44f66a900/675e1262cbd7d6bc5f15c6b0/japan-725347-Header_Mobile.jpg?fit=crop&disable=upscale&auto=webp&quality=60&crop=smart">

  <style>
    :root {
      --spacing: 10px;
      --blur: 10px;
      --base: #ffc600;
    }
    img {
      padding: var(--spacing);
      filter: blur(var(--blur));
      background: var(--base);
    }

    .hl{
      color: var(--base); /*Translates to: anything with the 'hl' class will be colored with the base variable value. */
    }
    /*
      misc styles, nothing to do with CSS variables
    */

    body {
      text-align: center;
      background: #193549;
      color: white;
      font-family: 'helvetica neue', sans-serif;
      font-weight: 100;
      font-size: 50px;
    }

    .controls {
      margin-bottom: 50px;
    }

    input {
      width: 100px;
    }
  </style>

  <script>
    const inputs = document.querySelectorAll('.controls input'); //selects all the inputs inside the controls class and stores them in a variable called inputs.
    
    function handleUpdate() {
      const suffix = this.dataset.sizing || ''; //gets the value of the data-sizing attribute from the input that triggered the event and stores it in a variable called suffix. If the data-sizing attribute is not present, it defaults to an empty string.
      document.documentElement.style.setProperty(`--${this.name}`, this.value + suffix); //sets the CSS variable with the name of the input (e.g. --spacing) to the value of the input plus the suffix (e.g. 10px). This updates the CSS variables in real-time as the user interacts with the inputs.
    }
    inputs.forEach(input => input.addEventListener('change', handleUpdate)); //for each input, add an event listener that listens for the change event and calls the handleUpdate function.
    inputs.forEach(input => input.addEventListener('mousemove', handleUpdate)); //for each input, add an event listener that listens for the mousemove event and calls the handleUpdate function. This allows the CSS variables to update in real-time as the user moves the slider.
  </script>

</body>
</html>
